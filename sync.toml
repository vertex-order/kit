# platforms-only, not published: site/ZoomedPlatformIcon.dc.html
# (2x wrapper — kit doesn't need it).

[publish.consumers] # for humans; sync.py ignores this
"vertex-order/platforms" = "pulls the paths above for its tuning bench"
"vertex-order/<list>" = "pulls kit for the above, plus platforms directly for the platform micro-kit (not transitively through kit — see sync.list.toml's [subscribe.platforms]); Intro.dc.html is not among them — each list owns its own copy, seeded once at template time (see docs/init-list.md)"

[subscribe.platforms]
repo = "vertex-order/platforms"
ref = "4048594f4cf970a2b6f3076cc98c7d7595758ffc"
paths = [
  "site/PlatformIcon.dc.html",
  "site/data/platform-icons.js",
  "site/images/platforms/",
]
