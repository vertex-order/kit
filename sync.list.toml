# sync.toml — cross-repo file sync. Read by scripts/sync.py (`just sync`).
# See AGENTS.md → "Cross-repo sync" and CONTRIBUTING.md.
#
# [subscribe.*] — what THIS repo vendors FROM elsewhere. sync.py fetches these
#                 at `ref` and writes them into the tree. Vendored copies —
#                 never hand-edit them here; edit them in the owning repo (kit).
#                 check-vendored.yml fails the PR if any has drifted.
#
# This repo publishes nothing — it owns no file another repo vendors.
#
# Two subscriptions, not one: platform-icon files (PlatformIcon.dc.html,
# platform-icons.js, images/platforms/) come straight from platforms, not
# transitively through kit — one less hop/repin/PR to wait on when platforms
# changes. Everything else comes from kit.
#
# Not vendored, even though this repo needs its own: .github/ISSUE_TEMPLATE/*
# and .github/PULL_REQUEST_TEMPLATE.md. Each necessarily carries this repo's
# own Discussions URL (and PR-checklist lines), so a byte-identical vendor is
# impossible by construction. Seeded from kit's copies once, then maintained
# locally.
#
# `sync.list.toml` below is vendored too, but never applied automatically —
# sync.toml can't self-update (chicken-and-egg, and it'd clobber this
# repo's own tweaks). It's purely a diff target: after `just sync`, compare
# it against this file's own [subscribe.kit].paths to see whether kit added
# a path this repo hasn't picked up yet.

[subscribe.kit]
repo = "vertex-order/kit"
ref = "main" # pin to a commit SHA / tag for reproducibility: `just sync`
paths = [
  "sync.list.toml",
  "docs/cache.md",
  "docs/data.md",
  "docs/tooling.md",
  "docs/responsive-design.md",
