# kit-only, not vendored elsewhere. Every file these ecosystems would
# touch (package.json, pyproject.toml/uv.lock, .github/workflows/*.yml) is
# byte-identical-vendored FROM here into every other vertex-order repo
# (sync.toml) -- a bump dependabot proposed against a vendored copy would
# always fail check-vendored.yml's drift check regardless of content, since
# that copy is only ever supposed to change via `just sync` pulling from
# here. If a repo ever gains something it genuinely owns and wants
# dependabot on, give it its own dependabot.yml with just that ecosystem.
version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

  # package.json's build-time deps for scripts/ssr-render.js (jsdom, and
  # react/react-dom pinned to match site/support.js's own CDN load — see
  # that script's header comment) and the dev-only lint/format tools
  # (stylelint, prettier, oxlint, @action-validator/*, @taplo/cli,
  # ajv-cli — see docs/tooling.md). svgo still runs via `npx`, not a
  # manifest entry, so it's not covered here.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

  # pyproject.toml/uv.lock's one dev dependency: ruff (see docs/tooling.md).
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
