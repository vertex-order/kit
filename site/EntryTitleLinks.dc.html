<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-for list="{{ parts }}" as="p" hint-placeholder-count="1"><a href="{{ p.url }}" target="_blank" rel="noopener" title="{{ p.tip }}" onMouseEnter="{{ onMouseEnter }}" onMouseLeave="{{ onMouseLeave }}" style="margin-right: var(--space-2); {{ p.smallStyle }}">{{ p.label }}</a></sc-for><sc-if value="{{ showPilcrow }}" hint-placeholder-val="{{ true }}"><a href="{{ pilcrowHref }}" onClick="{{ onPilcrowClick }}" title="Link to this entry" style="color: var(--color-neutral-500); text-decoration: none; font-size: 12px; opacity: {{ pilcrowOpacity }}; transition: opacity .15s; white-space: nowrap;">¶</a></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 220, &quot;height&quot;: 20}, &quot;parts&quot;: {&quot;editor&quot;: null, &quot;default&quot;: [], &quot;tsType&quot;: &quot;array&quot;}, &quot;onMouseEnter&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;function | null&quot;}, &quot;onMouseLeave&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;function | null&quot;}, &quot;pilcrowHref&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;string | null&quot;}, &quot;onPilcrowClick&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;function | null&quot;}, &quot;pilcrowOpacity&quot;: {&quot;editor&quot;: null, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;}, &quot;showPilcrow&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}}"></script>
</body>
</html>
