<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/styles.css"
        />
        <script src="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/_ds_bundle.js"></script>
        <!-- data/theme.css: per-repo color overrides, not vendored -- see docs/init-list.md "Theme colors" -->
        <link rel="stylesheet" href="data/theme.css" />
        <script src="./theme-dev.js"></script>
      </helmet>
      <span
        onMouseEnter="{{ onMouseEnter }}"
        onMouseLeave="{{ onMouseLeave }}"
        style="display: contents"
        ><sc-for list="{{ parts }}" as="p" hint-placeholder-count="1"
          ><a
            href="{{ p.url }}"
            target="_blank"
            rel="noopener"
            title="{{ p.tip }}"
            onClick="{{ partClick }}"
            style="margin-right: var(--space-2); {{ p.smallStyle }}"
            >{{ p.label }}<sc-for list="{{ p.dateSegments }}" as="d"
              ><span title="{{ d.tip }}">{{ d.text }}</span></sc-for
            ></a
          ></sc-for
        ><sc-if value="{{ showPilcrow }}" hint-placeholder-val="{{ true }}"
          ><a
            href="{{ pilcrowHref }}"
            onClick="{{ onPilcrowClick }}"
            title="Link to this entry"
            style="color: var(--color-neutral-500); text-decoration: none; font-size: 12px; opacity: {{ pilcrowOpacity }}; transition: opacity .15s; white-space: nowrap;"
            >¶</a
          ></sc-if
        ></span
      >
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview": {"width": 220, "height": 20}, "parts": {"editor": null, "default": [], "tsType": "array"}, "partClick": {"editor": null, "default": null, "tsType": "function | null"}, "onMouseEnter": {"editor": null, "default": null, "tsType": "function | null"}, "onMouseLeave": {"editor": null, "default": null, "tsType": "function | null"}, "pilcrowHref": {"editor": null, "default": null, "tsType": "string | null"}, "onPilcrowClick": {"editor": null, "default": null, "tsType": "function | null"}, "pilcrowOpacity": {"editor": null, "default": 0, "tsType": "number"}, "showPilcrow": {"editor": null, "default": true, "tsType": "boolean"}}'
    ></script>
  </body>
</html>
