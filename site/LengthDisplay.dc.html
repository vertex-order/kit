<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ value }}" hint-placeholder-val="{{ false }}">
  <span style="display: flex; flex-direction: column; gap: 1px;">
    <span style="color: var(--color-neutral-500);">Length</span>
    <span>{{ value }}</span>
  </span>
</sc-if>
<sc-if value="{{ parts }}" hint-placeholder-val="{{ false }}">
  <span style="display: flex; flex-direction: column; gap: 1px;">
    <span style="color: var(--color-neutral-500);">Length</span>
    <span><sc-for list="{{ parts }}" as="lp" hint-placeholder-count="3"><sc-if value="{{ lp.label }}" hint-placeholder-val="{{ false }}">{{ lp.label }}</sc-if><abbr title="{{ lp.tip }}" style="text-decoration: none; cursor: help;">{{ lp.value }}</abbr><sc-if value="{{ lp.sep }}" hint-placeholder-val="{{ false }}">{{ lp.sepChar }}</sc-if><sc-if value="{{ lp.br }}" hint-placeholder-val="{{ false }}"><br></sc-if></sc-for></span>
  </span>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 90, &quot;height&quot;: 32}, &quot;value&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;string | null&quot;}, &quot;parts&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;array | null&quot;}}"></script>
</body>
</html>
