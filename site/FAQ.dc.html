<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<h3 id="faq" style="font-family: var(--font-heading); font-weight: 500; font-size: 14px; letter-spacing: 0.06em; color: var(--color-neutral-400); margin: 0 0 var(--space-2); scroll-margin-top: 60px;">FAQ</h3>
<div style="margin: 0 0 var(--space-6); display: flex; flex-direction: column; gap: var(--space-3);">
  <sc-for list="{{ items }}" as="item" hint-placeholder-count="9">
    <div>
      <p style="color: var(--color-text); font-size: 13px; font-weight: 500; margin: 0 0 4px;">{{ item.q }}</p>
      <sc-for list="{{ item.paragraphs }}" as="para" hint-placeholder-count="1">
        <p style="color: var(--color-neutral-500); font-size: 12px; line-height: 1.7; margin: 0 0 {{ para.mb }};">
          <sc-if value="{{ para.plain }}" hint-placeholder-val="{{ false }}">{{ para.plain }}</sc-if>
          <sc-if value="{{ para.parts }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ para.parts }}" as="part" hint-placeholder-count="0">
              <sc-if value="{{ part.em }}" hint-placeholder-val="{{ false }}"><em>{{ part.em }}</em></sc-if>
              <sc-if value="{{ part.text }}" hint-placeholder-val="{{ false }}">{{ part.text }}</sc-if>
            </sc-for>
          </sc-if>
        </p>
      </sc-for>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 620, &quot;height&quot;: 400}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;default&quot;: [], &quot;tsType&quot;: &quot;array&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = (this.props.items || []).map(item => ({
      q: item.q,
      paragraphs: item.a.map((para, i, arr) => {
        const mb = i === arr.length - 1 ? '0' : '8px';
        return typeof para === 'string' ? { plain: para, mb } : { parts: para.parts, mb };
      }),
    }));
    return { items };
  }
}
</script>
</body>
</html>
