<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/styles.css">
<script src="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/_ds_bundle.js"></script>
<!-- data/theme.css: per-repo color overrides, not vendored -- see docs/init-list.md "Theme colors" -->
<link rel="stylesheet" href="data/theme.css">
<script src="./theme-dev.js"></script>
</helmet>
<section id="{{ s.id }}" ref="{{ s.sectionRef }}" style="margin-bottom: var(--space-8);">
  <div style="height: 1px; background: linear-gradient(to right, transparent, var(--color-neutral-700), transparent); margin-bottom: var(--space-8);"></div>
  <div style="display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-4);">
    <span style="font-family: var(--font-heading); color: var(--color-accent-300); font-size: 14px; letter-spacing: 0.06em;">{{ s.eyebrow }}</span>
  </div>
  <h2 style="font-family: var(--font-display, var(--font-heading)); font-weight: var(--font-display-weight, 500); letter-spacing: var(--font-display-tracking, normal); font-size: 26px; margin: 0 0 var(--space-4); display: flex; align-items: baseline; gap: var(--space-2);" onMouseEnter="{{ s.onAnchorHoverEnter }}" onMouseLeave="{{ s.onAnchorHoverLeave }}"><span><sc-if value="{{ s.url }}" hint-placeholder-val="{{ false }}"><a href="{{ s.url }}" target="_blank" rel="noopener" style="color: inherit;">{{ s.title }}</a></sc-if><sc-if value="{{ !s.url }}" hint-placeholder-val="{{ true }}">{{ s.title }}</sc-if></span><a href="{{ s.anchorHref }}" onClick="{{ s.onAnchorClick }}" title="Link to this series" style="color: var(--color-neutral-500); text-decoration: none; font-size: 16px; opacity: {{ s.pilcrowOpacity }}; transition: opacity .15s; white-space: nowrap;">¶</a></h2>

  <sc-if value="{{ s.note }}" hint-placeholder-val="{{ false }}">
    <div style="max-width: 720px; margin: 0 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);">
      <sc-for list="{{ s.noteParas }}" as="np" hint-placeholder-count="1">
        <p style="color: var(--color-neutral-400); font-size: 14px; line-height: 1.6; margin: 0;"><sc-if value="{{ np.text }}" hint-placeholder-val="{{ false }}">{{ np.text }}</sc-if><sc-if value="{{ np.parts }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ np.parts }}" as="sg" hint-placeholder-count="0"><dc-import name="TextSpan" tip="{{ sg.tip }}" help-style="{{ sg.helpStyle }}" em-link-text="{{ sg.emLinkText }}" em-link-url="{{ sg.emLinkUrl }}" em-text="{{ sg.emText }}" abbr-term="{{ sg.abbrTerm }}" abbr-def="{{ sg.abbrDef }}" text="{{ sg.text }}" tip-text="{{ sg.tipText }}" jp-tag="{{ sg.jpTag }}" hint-size="auto,16px" style="display: inline;"></dc-import></sc-for></sc-if></p>
      </sc-for>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: var(--space-1);">
    <sc-for list="{{ s.media }}" as="g" hint-placeholder-count="0">
      <dc-import name="MediaEntry" g="{{ g }}" show-rating="{{ showRating }}" show-length="{{ showLength }}" show-platforms="{{ showPlatforms }}" show-languages="{{ showLanguages }}" side-by-side="{{ sideBySide }}" stacked="{{ stacked }}" show-col2="{{ showCol2 }}" show-stacked-rl="{{ showStackedRl }}" hint-size="auto,80px" style="display: block;"></dc-import>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 760, &quot;height&quot;: 200}, &quot;s&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;object&quot;}, &quot;showRating&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showLength&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showPlatforms&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showLanguages&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;sideBySide&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;stacked&quot;: {&quot;editor&quot;: null, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showCol2&quot;: {&quot;editor&quot;: null, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showStackedRl&quot;: {&quot;editor&quot;: null, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}"></script>
</body>
</html>
