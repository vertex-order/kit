<!-- RatingDisplay.dc.html — owned by vertex-order/kit. Edit here.
     Vendored elsewhere via sync.toml; don't edit the copy there. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/styles.css">
<script src="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/_ds_bundle.js"></script>
<!-- data/theme.css: per-repo color overrides, not vendored -- see docs/init-list.md "Theme colors" -->
<link rel="stylesheet" href="data/theme.css">
<script src="./theme-dev.js"></script>
</helmet>
<!-- `ratings` (schema: series.schema.json#/$defs/RatingItem[]) -- each item
     is independently either a badge (isBadge, e.g. NYR/TBD/favorable, a
     plain score/abbr-tooltip, never linked as a score) or a linked score
     (isScore); one release can mix both. Resolved by resolveRatings() in
     page.dc.html, not here -- this component only renders the two shapes. -->
<sc-if value="{{ ratings }}" hint-placeholder-val="{{ false }}">
  <span style="display: flex; flex-direction: column; gap: 1px;">
    <span style="color: var(--color-neutral-500);">Rating</span>
    <span>
      <sc-for list="{{ ratings }}" as="r" hint-placeholder-count="2">
        <sc-if value="{{ r.isBadge }}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{ r.score }}" hint-placeholder-val="{{ false }}">
            <span>{{ r.score }}</span>
          </sc-if>
          <sc-if value="{{ r.abbrTermLinked }}" hint-placeholder-val="{{ false }}">
            <a href="{{ r.url }}" target="_blank" rel="noopener"><abbr title="{{ r.abbrDef }}" style="text-decoration: underline dotted; cursor: help;">{{ r.abbrTerm }}</abbr></a>
          </sc-if>
          <sc-if value="{{ r.abbrTermPlain }}" hint-placeholder-val="{{ false }}">
            <abbr title="{{ r.abbrDef }}" style="text-decoration: underline dotted; cursor: help;">{{ r.abbrTerm }}</abbr>
          </sc-if>
        </sc-if>
        <sc-if value="{{ r.isScore }}" hint-placeholder-val="{{ true }}">
          <a href="{{ r.url }}" target="_blank" rel="noopener" title="{{ r.label }}">{{ r.value }}</a>
        </sc-if>
        <sc-if value="{{ r.sep }}" hint-placeholder-val="{{ false }}"> / </sc-if>
      </sc-for>
    </span>
  </span>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 90, &quot;height&quot;: 40}, &quot;ratings&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;array | null&quot;}}"></script>
</body>
</html>
