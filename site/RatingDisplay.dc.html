<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ rating }}" hint-placeholder-val="{{ false }}">
  <span style="display: flex; flex-direction: column; gap: 1px;">
    <span style="color: var(--color-neutral-500);">Rating</span>
    <sc-if value="{{ rating.textOnly }}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{ rating.score }}" hint-placeholder-val="{{ false }}">
        <span>{{ rating.score }}</span>
      </sc-if>
      <sc-if value="{{ rating.abbrTermLinked }}" hint-placeholder-val="{{ false }}">
        <span><a href="{{ rating.url }}" target="_blank" rel="noopener"><abbr title="{{ rating.abbrDef }}" style="text-decoration: underline dotted; cursor: help;">{{ rating.abbrTerm }}</abbr></a></span>
      </sc-if>
      <sc-if value="{{ rating.abbrTermPlain }}" hint-placeholder-val="{{ false }}">
        <span><abbr title="{{ rating.abbrDef }}" style="text-decoration: underline dotted; cursor: help;">{{ rating.abbrTerm }}</abbr></span>
      </sc-if>
    </sc-if>
    <sc-if value="{{ rating.single }}" hint-placeholder-val="{{ false }}">
      <span><a href="{{ rating.url }}" target="_blank" rel="noopener" title="{{ rating.sourceLabel }}">{{ rating.score }}</a><sc-if value="{{ rating.midScore }}" hint-placeholder-val="{{ false }}"> / <a href="{{ rating.midUrl }}" target="_blank" rel="noopener" title="{{ rating.midLabelText }}">{{ rating.midScore }}</a></sc-if></span>
    </sc-if>
    <sc-if value="{{ rating.sourceUrl }}" hint-placeholder-val="{{ false }}">
      <span><a href="{{ rating.url }}" target="_blank" rel="noopener" title="{{ rating.scoreLabelText }}">{{ rating.score }}</a><sc-if value="{{ rating.midScore }}" hint-placeholder-val="{{ false }}"> / <a href="{{ rating.midUrl }}" target="_blank" rel="noopener" title="{{ rating.midLabelText }}">{{ rating.midScore }}</a></sc-if> / <a href="{{ rating.sourceUrl }}" target="_blank" rel="noopener" title="{{ rating.sourceLabel }}">{{ rating.source }}</a></span>
    </sc-if>
  </span>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 90, &quot;height&quot;: 40}, &quot;rating&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;object | null&quot;}}"></script>
</body>
</html>
