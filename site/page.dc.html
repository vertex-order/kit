<script type="text/x-dc" data-dc-script>
// SITE_CONFIG/CREDITS come from site/data/{site,credits}.js (per-repo, not
// vendored) -- see docs/init-list.md. Intro.dc.html's own prose is likewise
// per-repo, but lives in the component itself, not in data/.
const SITE = window.SITE_CONFIG || {};
const LAST_UPDATED = SITE.lastUpdated || ''; // ISO date; empty is valid (no "Last Updated" shown)
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function lastUpdatedShortText() {
  if (!LAST_UPDATED) return '';
  const [y, m] = LAST_UPDATED.split('-').map(Number);
  return MONTHS_SHORT[m - 1] + ' ' + y;
}
// Deterministic fallback so a repo that omits SITE_CONFIG.storagePrefix still
// gets a stable (never regenerated differently across builds), legible
// localStorage key prefix derived from its own name -- e.g. "Chrono Trigger"
// -> "chronoTriggerPlayOrder". A repo with real visitor data (final-fantasy,
// kingdom-hearts) must set storagePrefix explicitly to its existing literal
// value instead: this fallback would compute a different string and silently
// orphan everyone's saved checklist/theme/display preferences.
function slugifyName(name) {
  return (name || 'vertexOrder').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(' ')
    .filter(Boolean)
    .map((w, i) => i === 0 ? w.charAt(0).toLowerCase() + w.slice(1) : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
    .join('');
}
const STORAGE_PREFIX = SITE.storagePrefix || (slugifyName(SITE.name) + 'PlayOrder');
// Stable per-entry keys (pilcrow anchors + checked/skipped state), derived
// from content instead of array position -- editing games[] (insert/
// remove/reorder, a routine data edit) must not silently reattach a
// #entry-... link or a saved checkbox to a different entry.
function slugifyTitle(s) {
  return String(s || '')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/['’]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .toLowerCase();
}
// Canonical full-precision string for a title_date/subtitle_date value --
// the value itself when it's already a string (a full date, ord-trick
// suffix included), the year as a string for a plain year number, or a
// {start,end} range's start year. Mirrors what releaseDate used to give
// raw for string-sort/dedupe comparison; titleDateYear() below slices it
// down to just the year for slugs/display.
function titleDateKey(d) {
  if (d === null || d === undefined) return '';
  if (typeof d === 'object') return String(d.start);
  return String(d);
}
function titleDateYear(d) {
  return titleDateKey(d).slice(0, 4);
}
// Slug for a media[] slot: its own title + release year (the slot's title
// is the stable identity now -- unaffected by which edition is currently
// `primary`), or an explicit `id:` override for the rare collision/retitle
// case. This is also what a list repo's sources/<SERIES>/<slug>.md is named
// after (see docs/sources.md there) -- one derivation serves both.
function entrySlug(slot) {
  if (slot.id) return slot.id;
  const yr = titleDateYear(slot.titleDate);
  return slugifyTitle(slot.title) + (yr ? '-' + yr : '');
}
