<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="margin-top: 2px;"><span style="font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; color: {{ color }}; background: {{ bg }}; border-radius: var(--radius-sm); padding: 2px 6px;">{{ label }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 90, &quot;height&quot;: 20}, &quot;label&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;Help wanted&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;var(--color-neutral-400)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;bg&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;var(--color-neutral-800)&quot;, &quot;tsType&quot;: &quot;string&quot;}}"></script>
</body>
</html>
