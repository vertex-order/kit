     Vendored elsewhere via sync.toml; don't edit the copy there. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/styles.css">
<script src="_ds/nocturne-dd511f00-0314-498c-83ef-49f001a371b0/_ds_bundle.js"></script>
</helmet>

<h1 style="font-family: var(--font-heading); font-weight: 500; font-size: 40px; margin: var(--space-6) 0 0;">{{ title }}</h1>
<sc-if value="{{ lastUpdatedText }}" hint-placeholder-val="{{ false }}">
  <p style="color: var(--color-neutral-600); font-size: 11px; margin: 4px 0 var(--space-3);">Last Updated: {{ lastUpdatedText }}</p>
</sc-if>
<p style="color: var(--color-neutral-300); font-size: 16px; line-height: 1.6; max-width: 620px; margin: 0 0 var(--space-3);">
  <sc-for list="{{ tagline }}" as="part" hint-placeholder-count="0">
    <sc-if value="{{ part.strong }}" hint-placeholder-val="{{ false }}"><strong style="color: var(--color-text); font-weight: 500;">{{ part.strong }}</strong></sc-if>
    <sc-if value="{{ part.emLink }}" hint-placeholder-val="{{ false }}"><em><a href="{{ part.emLinkUrl }}" style="color: inherit;">{{ part.emLink }}</a></em></sc-if>
    <sc-if value="{{ part.em }}" hint-placeholder-val="{{ false }}"><em>{{ part.em }}</em></sc-if>
    <sc-if value="{{ part.url }}" hint-placeholder-val="{{ false }}"><a href="{{ part.url }}" style="color: inherit;">{{ part.text }}</a></sc-if>
    <sc-if value="{{ part.plainText }}" hint-placeholder-val="{{ false }}">{{ part.plainText }}</sc-if>
  </sc-for>
</p>

<sc-for list="{{ sections }}" as="s" hint-placeholder-count="1">
  <sc-if value="{{ s.isStats }}" hint-placeholder-val="{{ false }}">
    <p style="color: var(--color-neutral-300); font-size: 16px; line-height: 1.6; max-width: 620px; margin: 0 0 var(--space-6);">{{ statsText }}</p>
  </sc-if>
  <sc-if value="{{ s.hasHeading }}" hint-placeholder-val="{{ true }}">
    <p style="color: var(--color-neutral-300); font-size: 16px; line-height: 1.6; margin: var(--space-2) 0 0;">
      <span onMouseEnter="{{ s.onAnchorHoverEnter }}" onMouseLeave="{{ s.onAnchorHoverLeave }}" style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px;">
        <strong id="{{ s.anchorId }}" style="color: var(--color-text); font-weight: 500; font-size: {{ s.headingFontSize }}; scroll-margin-top: 70px;">{{ s.heading }}</strong>
        <sc-if value="{{ s.hasId }}" hint-placeholder-val="{{ true }}">
          <a href="{{ s.anchorHref }}" onClick="{{ s.onAnchorClick }}" title="Link to this section" style="color: var(--color-neutral-500); text-decoration: none; font-size: {{ s.pilcrowFontSize }}; opacity: {{ s.pilcrowOpacity }}; transition: opacity .15s;">&para;</a>
        </sc-if>
      </span>
    </p>
  </sc-if>
  <sc-for list="{{ s.paragraphs }}" as="para" hint-placeholder-count="1">
    <p style="color: var(--color-neutral-300); font-size: 16px; line-height: 1.6; margin: {{ para.mt }} 0 0;">
      <sc-if value="{{ para.plain }}" hint-placeholder-val="{{ false }}">{{ para.plain }}</sc-if>
      <sc-if value="{{ para.parts }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ para.parts }}" as="part" hint-placeholder-count="0">
          <sc-if value="{{ part.strong }}" hint-placeholder-val="{{ false }}"><strong style="color: var(--color-text); font-weight: 500;">{{ part.strong }}</strong></sc-if>
          <sc-if value="{{ part.emLink }}" hint-placeholder-val="{{ false }}"><em><a href="{{ part.emLinkUrl }}" style="color: inherit;">{{ part.emLink }}</a></em></sc-if>
          <sc-if value="{{ part.em }}" hint-placeholder-val="{{ false }}"><em>{{ part.em }}</em></sc-if>
          <sc-if value="{{ part.url }}" hint-placeholder-val="{{ false }}"><a href="{{ part.url }}" style="color: inherit;">{{ part.text }}</a></sc-if>
          <sc-if value="{{ part.plainText }}" hint-placeholder-val="{{ false }}">{{ part.plainText }}</sc-if>
        </sc-for>
      </sc-if>
    </p>
  </sc-for>
</sc-for>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 620, &quot;height&quot;: 500}, &quot;title&quot;: {&quot;editor&quot;: &quot;string&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;lastUpdated&quot;: {&quot;editor&quot;: &quot;string&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;tagline&quot;: {&quot;editor&quot;: null, &quot;default&quot;: [], &quot;tsType&quot;: &quot;array&quot;}, &quot;statsText&quot;: {&quot;editor&quot;: &quot;string&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;sections&quot;: {&quot;editor&quot;: null, &quot;default&quot;: [], &quot;tsType&quot;: &quot;array&quot;}}">
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function mapParts(parts) {
  return (parts || []).map(p => ({
    strong: p.strong,
    emLink: (p.em && p.url) ? p.em : undefined,
    emLinkUrl: (p.em && p.url) ? p.url : undefined,
    em: (p.em && !p.url) ? p.em : undefined,
    url: (p.url && !p.em) ? p.url : undefined,
    text: (p.url && !p.em) ? p.text : undefined,
    plainText: (!p.strong && !p.em && !p.url) ? p.text : undefined,
  }));
}
function mapParagraphs(paragraphs) {
  return (paragraphs || []).map((para, i, arr) => {
    const mt = i === 0 ? '0' : 'var(--space-2)';
    return typeof para === 'string' ? { plain: para, mt } : { parts: mapParts(para.parts), mt };
  });
}
class Component extends DCLogic {
  state = { hoverAnchor: null };
  componentDidMount() {
    const hash = (location.hash || '').replace('#', '');
    if (hash && (this.props.sections || []).some(s => s.id === hash)) {
      requestAnimationFrame(() => requestAnimationFrame(() => this.scrollToId(hash)));
    }
  }
  scrollToId(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 70;
    window.scrollTo({ top, behavior: 'smooth' });
  }
  buildPilcrow(anchorId) {
    return {
      hasId: true,
      anchorId,
      anchorHref: '#' + anchorId,
      pilcrowOpacity: this.state.hoverAnchor === anchorId ? 1 : 0,
      onAnchorHoverEnter: () => this.setState({ hoverAnchor: anchorId }),
      onAnchorHoverLeave: () => this.setState(s => s.hoverAnchor === anchorId ? { hoverAnchor: null } : null),
      onAnchorClick: e => { e.preventDefault(); history.pushState(null, '', '#' + anchorId); this.scrollToId(anchorId); },
    };
  }
  renderVals() {
    const noPilcrow = { hasId: false, anchorId: '', anchorHref: '', pilcrowOpacity: 0, onAnchorHoverEnter: () => {}, onAnchorHoverLeave: () => {}, onAnchorClick: () => {} };
    const sections = (this.props.sections || []).map(s => {
      if (s.stats) return { isStats: true, hasHeading: false, paragraphs: [] };
      return {
        hasHeading: !!s.heading,
        heading: s.heading,
        headingFontSize: s.headingSize === 'lg' ? '24px' : '18px',
        pilcrowFontSize: s.headingSize === 'lg' ? '14px' : '13px',
        ...(s.id ? this.buildPilcrow(s.id) : noPilcrow),
        paragraphs: mapParagraphs(s.paragraphs),
      };
    });
    let lastUpdatedText = '';
    if (this.props.lastUpdated) {
      const [y, m] = this.props.lastUpdated.split('-').map(Number);
      lastUpdatedText = MONTHS_LONG[m - 1] + ' ' + y;
    }
    return {
      title: this.props.title || '',
      lastUpdatedText,
      tagline: mapParts(this.props.tagline),
      statsText: this.props.statsText || '',
      sections,
    };
  }
}
</script>
</body>
</html>
